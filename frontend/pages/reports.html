<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reports — AI Interview Platform</title>
  <link rel="stylesheet" href="/css/global.css">
  <link rel="stylesheet" href="/css/pages.css">
</head>
<body>
  
  <div class="sidebar-overlay"></div>
  <div class="app-layout">
    <aside class="sidebar"></aside>

    <main class="main-content">
      <header class="top-header">
        <div class="header-left">
          <button class="mobile-menu-btn">☰</button>
          <div>
            <h2 class="page-title">Candidate Reports</h2>
            <div class="breadcrumb">Download detailed PDF evaluation reports</div>
          </div>
        </div>
        <div class="header-right">
          <div style="text-align:right">
            <div style="font-weight:600;font-size:0.9rem" id="user-name">Loading...</div>
            <div style="font-size:0.75rem;color:var(--text-tertiary)" id="user-role">User</div>
          </div>
          <div class="avatar" id="user-avatar">U</div>
        </div>
      </header>

      <div class="page-content">
        <div class="card animate-slide-up">
          <div class="card-header">
            <h3 class="card-title">Generated Reports</h3>
            <button class="btn btn-primary btn-sm" id="gen-btn" onclick="generateReport()">Generate New Report</button>
          </div>

          <div class="table-container">
            <table>
              <thead>
                <tr>
                  <th>Report Name</th>
                  <th>Type</th>
                  <th>Date Generated</th>
                  <th>Action</th>
                </tr>
              </thead>
              <tbody id="reports-table">
                <tr><td colspan="4" class="text-center">Loading...</td></tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </main>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/components.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      const user = initDashboardPage('reports');
      if(user) document.getElementById('user-role').textContent = user.role.charAt(0).toUpperCase() + user.role.slice(1);
      
      // Hide generate button for recruiters/admins here (they generate from candidate view)
      if (user && user.role !== 'candidate') {
        document.getElementById('gen-btn').classList.add('hidden');
      }

      await loadReports();
    });

    async function loadReports() {
      const res = await api.get('/reports');
      const tbody = document.getElementById('reports-table');
      
      if (res.success) {
        if (res.data.length === 0) {
          tbody.innerHTML = '<tr><td colspan="4" class="text-center">No reports generated yet.</td></tr>';
        } else {
          tbody.innerHTML = res.data.map(r => `
            <tr>
              <td style="font-weight:500">
                <span style="font-size:1.2rem;margin-right:8px">📄</span>
                ${r.title}
              </td>
              <td style="text-transform:capitalize">${r.report_type}</td>
              <td>${formatDateTime(r.generated_at)}</td>
              <td>
                <button class="btn btn-secondary btn-sm" onclick="downloadReport(${r.id}, '${r.file_name}')">
                  Download PDF
                </button>
              </td>
            </tr>
          `).join('');
        }
      }
    }

    async function generateReport() {
      const btn = document.getElementById('gen-btn');
      btn.disabled = true;
      btn.innerHTML = '<div class="spinner spinner-sm"></div> Generating...';

      const res = await api.post('/reports/generate', { type: 'comprehensive' });

      btn.disabled = false;
      btn.innerHTML = 'Generate New Report';

      if (res.success) {
        toast.success('Report generated successfully!');
        await loadReports(); // Reload table
        // Auto download
        downloadReport(res.data.reportId, res.data.fileName);
      } else {
        toast.error('Failed to generate report.');
      }
    }

    function downloadReport(id, filename) {
      toast.info('Starting download...');
      api.download(`/reports/${id}/download`, filename);
    }
  </script>
</body>
</html>
