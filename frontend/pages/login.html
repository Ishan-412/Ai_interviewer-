<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — AI Interview Platform</title>
  <link rel="stylesheet" href="/css/global.css">
  <link rel="stylesheet" href="/css/pages.css">
</head>
<body>
  
  <div class="auth-page">
    <div class="auth-container animate-slide-up">
      <div class="auth-card">
        <div class="auth-logo">
          <div class="auth-logo-icon">AI</div>
          <div class="auth-logo-text">Interview Platform</div>
        </div>
        
        <h1 class="auth-title">Welcome back</h1>
        <p class="auth-subtitle">Sign in to your account to continue</p>

        <form id="loginForm" class="auth-form">
          <div class="form-group">
            <label class="form-label" for="email">Email address</label>
            <input type="email" id="email" class="form-input" placeholder="name@example.com" required>
          </div>
          
          <div class="form-group">
            <div style="display:flex;justify-content:space-between">
              <label class="form-label" for="password">Password</label>
              <a href="/forgot-password" class="forgot-link">Forgot password?</a>
            </div>
            <div class="password-toggle">
              <input type="password" id="password" class="form-input" placeholder="••••••••" required>
              <button type="button" class="toggle-btn" onclick="togglePassword('password')">👁️</button>
            </div>
          </div>

          <button type="submit" class="btn btn-primary w-full btn-lg" id="submitBtn">
            Sign In
          </button>
        </form>

        <div class="auth-divider">or</div>

        <div class="auth-footer">
          Don't have an account? <a href="/register">Sign up for free</a>
        </div>
      </div>
    </div>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/components.js"></script>
  <script>
    function togglePassword(id) {
      const input = document.getElementById(id);
      input.type = input.type === 'password' ? 'text' : 'password';
    }

    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const btn = document.getElementById('submitBtn');
      
      btn.disabled = true;
      btn.innerHTML = '<div class="spinner spinner-sm"></div> Signing in...';

      const result = await api.post('/auth/login', { email, password });

      btn.disabled = false;
      btn.innerHTML = 'Sign In';

      if (result.success) {
        api.setTokens(result.data.accessToken, result.data.refreshToken);
        api.setUser(result.data.user);
        toast.success('Login successful!');
        
        setTimeout(() => {
          window.location.href = `/${result.data.user.role}-dashboard`;
        }, 500);
      } else {
        toast.error(result.message || 'Login failed. Please try again.');
      }
    });
  </script>
</body>
</html>
